<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page introuvable — Mngl Clean</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nf-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .nf-code {
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      opacity: 0.15;
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    .nf-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }
    .nf-text {
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0.55;
      max-width: 40ch;
      margin-bottom: 2.4rem;
      line-height: 1.7;
    }
    .nf-hero .tarif-btn { align-self: center; }
  </style>
</head>
<body>
  <section class="nf-hero">
    <div class="nf-code">404</div>
    <h1 class="nf-title">Cette page n'existe pas</h1>
    <p class="nf-text">Le lien est peut-être cassé, ou la page a été déplacée. Retourne à l'accueil pour retrouver tarifs, réservation et contact.</p>
    <a href="index.html" class="tarif-btn tarif-btn-inv">Retour à l'accueil</a>
  </section>
</body>
</html>
